<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>District 11</title>
<meta name="theme-color" content="#0d1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="District 11">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;width:100%;height:100%;background:#0d1726;color:#fff;font-family:system-ui,sans-serif}main{position:fixed;inset:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}iframe{border:0;width:100%;height:100%;display:block}#fallback{position:fixed;inset:25% 20px auto;text-align:center;background:#0d1726;padding:24px;border-radius:20px;z-index:2}a{color:#f9a8d4}button{background:#9d174d;color:white;border:0;border-radius:12px;padding:14px 22px;font:inherit} [hidden]{display:none!important}
</style>
</head>
<body>
<main><iframe id="app" title="District 11 household app" src="https://district11.streamlit.app/?embed=true" allow="clipboard-write; web-share"></iframe></main>
<section id="fallback" hidden><h1>District 11</h1><p>The app is taking a moment to connect.</p><p><button onclick="location.reload()">Try again</button></p><p><a href="https://district11.streamlit.app/">Open District 11 directly</a></p></section>
<noscript>JavaScript is needed to use District 11. <a href="https://district11.streamlit.app/">Open the app</a>.</noscript>
<script>
const frame=document.getElementById('app');
const fallback=document.getElementById('fallback');
const timer=setTimeout(()=>{fallback.hidden=false},25000);
frame.addEventListener('load',()=>{clearTimeout(timer);fallback.hidden=true});
window.addEventListener('offline',()=>{fallback.hidden=false});
if(!navigator.onLine)fallback.hidden=false;
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
