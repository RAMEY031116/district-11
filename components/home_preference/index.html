<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Remember home view</title></head><body style="margin:0"><script>
// Minimal Streamlit v1 component protocol. All storage stays in this origin.
const send=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
let restored=false;
window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data.type!=='streamlit:render')return;
  const args=event.data.args;
  const allowed=value=>value===null||args.valid_members.includes(value);
  if(!args.ready&&!restored){
    let member=null;
    try{
      const saved=JSON.parse(localStorage.getItem(args.storage_key));
      if(allowed(saved))member=saved;
    }catch(error){ /* Private browsing or unavailable storage: use household view. */ }
    restored=true;
    send('streamlit:setComponentValue',{value:{member_id:member},dataType:'json'});
  }else if(args.ready){
    try{localStorage.setItem(args.storage_key,JSON.stringify(allowed(args.selected)?args.selected:null));}
    catch(error){ /* The app still works when browser storage is blocked. */ }
  }
  send('streamlit:setFrameHeight',{height:0});
});
send('streamlit:componentReady',{apiVersion:1});
send('streamlit:setFrameHeight',{height:0});
</script></body></html>
